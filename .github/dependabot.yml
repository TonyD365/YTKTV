# Weekly dependency updates, each kind grouped into a single pull request so they
# arrive as one change to test (CI and the benchmark comparison run on it).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
  # One pip entry (Dependabot allows only one per directory), checked every day so yt-dlp
  # keeps up with YouTube. Minimum versions are raised, so the next release ships them.
  # yt-dlp comes as its own pull request; everything else together in another.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    versioning-strategy: increase
    labels: [dependencies]
    ignore:
      # pytest-benchmark breaks on pytest 9.2 ('Function' object has no attribute '_nodeid');
      # lift this once it catches up (pyproject.toml pins pytest<9.2 for the same reason).
      - dependency-name: pytest
        versions: [">=9.2"]
    groups:
      yt-dlp:
        patterns: ["yt-dlp*"]
      python:
        patterns: ["*"]
        exclude-patterns: ["yt-dlp*"]
