# Weekly dependency updates, each kind grouped into a single pull request so they
# arrive as one change to test (CI and the benchmark comparison run on it).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
  # yt-dlp has to keep up with YouTube, so it is checked every day on its own, and the
  # minimum version is raised: the next release then ships the newest one.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    versioning-strategy: increase
    allow:
      - dependency-name: "yt-dlp*"
    labels: [dependencies, youtube]
    groups:
      yt-dlp:
        patterns: ["yt-dlp*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    ignore:
      - dependency-name: "yt-dlp*"
    groups:
      python:
        patterns: ["*"]
