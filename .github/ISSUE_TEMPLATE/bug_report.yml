name: 🐞 Bug report
description: Something in YTKTV does not work the way it should
labels: [bug, triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: YTKTV version
      description: Shown on the Settings page, for example 1.3.0.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Installer from the Releases page
        - From source
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Graphics card
      description: Only needed for problems with vocal separation.
  - type: input
    id: video
    attributes:
      label: YouTube link
      description: Only needed when a particular song does not play, has no lyrics, or sounds wrong.
  - type: dropdown
    id: area
    attributes:
      label: Where is the problem?
      options:
        - Starting YTKTV or installing it
        - Video or music playback
        - Microphones or the mixing console
        - Original / instrumental (vocal separation)
        - The phone page or a phone microphone
        - Lyrics or scoring
        - Updates
        - Something else
  - type: textarea
    id: log
    attributes:
      label: Log output
      description: |
        If you can, start YTKTV with a log file and paste it here. See "Getting a log" in
        https://github.com/TonyD365/YTKTV/blob/main/docs/guide/troubleshooting.md
      render: text
