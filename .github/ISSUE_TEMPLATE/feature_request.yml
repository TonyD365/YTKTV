name: ✨ Feature request
description: Suggest something YTKTV should do
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation at your karaoke night, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
