# Labels pull requests by the parts of YTKTV they touch (.github/labeler.yml).
# It runs on pull_request, so it never gets write access for code from a fork:
# pull requests from forks get a read-only token and are simply left unlabelled.
name: Label pull requests

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    # A fork's token cannot add labels; skip instead of failing.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/labeler@v7
