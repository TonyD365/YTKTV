name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  installer:
    name: Terminal installer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v7
      - run: npm ci --no-audit --no-fund
      - name: Type-check, test and build
        run: |
          PATH="$PWD/node_modules/.bin:$PATH"
          bun build.ts linux-x64
          tsc --noEmit
          bun test
          dist/ytktv-installer-linux-x64 --help
          dist/ytktv-installer-linux-x64 --licenses | head -n 3

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
        # Pull requests test Python 3.11 on Linux only: macOS runners are few and queue for
        # long. main still runs every combination after a merge.
        exclude: ${{ github.event_name == 'pull_request' && fromJSON('[{"os":"macos-latest","python":"3.11"},{"os":"windows-latest","python":"3.11"}]') || fromJSON('[]') }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libportaudio2 libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: python -m pip install -e ".[dev]"
      - run: pytest
        env:
          # The look checks save a picture of every page here (one platform is enough).
          YTKTV_SCREENSHOTS: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.13' && format('{0}/screenshots', runner.temp) || '' }}
      - name: Keep the page screenshots
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
