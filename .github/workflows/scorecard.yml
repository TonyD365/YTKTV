# OpenSSF Scorecard: scores how YTKTV is kept safe (branch protection, token permissions,
# pinned dependencies, code review and more). Results show in the Security tab's code
# scanning alerts and on https://scorecard.dev.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write # to publish the results to scorecard.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: results.sarif
          category: scorecard
