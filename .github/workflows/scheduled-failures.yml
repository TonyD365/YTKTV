# When a scheduled run fails, open an issue (or comment on the open one for that workflow);
# when it passes again, close the issue. YouTube check and Security report their own
# failures with more detail, so they are not listed here.
#
# Runs from main after those workflows finish; it only reads their name and result.
name: Scheduled run failures

on:
  workflow_run:
    workflows: [PR commands, PR assistant, Security review reminder]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report:
    if: github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ secrets.AGENT_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          title="Scheduled run failed: $NAME"
          gh label create scheduled-failure --color d93f0b --description "A scheduled workflow run failed" 2>/dev/null || true
          open=$(gh issue list --state open --label scheduled-failure --limit 100 --json number,title \
            -q ".[] | select(.title == \"$title\") | .number" | head -n 1)
          case "$CONCLUSION" in
            success)
              [ -n "$open" ] && gh issue close "$open" --comment "✅ Passes again: $RUN" >/dev/null
              exit 0 ;;
            failure|timed_out|startup_failure) ;;
            *) exit 0 ;; # cancelled or skipped: nothing to report
          esac
          printf '%s\n' "The scheduled run of **$NAME** ended with \`$CONCLUSION\`." "" \
            "Run: $RUN" "" \
            "Open the run to see which step failed. This issue closes itself when a scheduled run passes again." > body.md
          if [ -n "$open" ]; then gh issue comment "$open" --body-file body.md >/dev/null
          else gh issue create --title "$title" --label scheduled-failure --body-file body.md >/dev/null; fi
