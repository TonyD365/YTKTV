# Known vulnerabilities in the dependencies (Python and the terminal installer's npm
# packages), and CodeQL's code scanning. On pull requests, main, and every Monday.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: installer/package-lock.json
      - name: Python packages
        run: |
          python -m pip install -e ".[dev]" pip-audit
          # Only what YTKTV installs from PyPI (YTKTV itself is not there).
          # PYSEC-2026-1325: ecdsa's timing side channel, which has no fixed version (pure
          # Python cannot be constant time). YTKTV signs room messages and its certificate
          # with it; moving those to the cryptography package removes it. Until then:
          pip-audit --skip-editable --progress-spinner off --ignore-vuln PYSEC-2026-1325
      - name: npm packages (terminal installer)
        working-directory: installer
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
