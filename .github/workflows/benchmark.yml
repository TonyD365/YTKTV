name: Benchmark

# Runs the benchmark suite for the base branch and for the pull request on the
# same runner, back to back, so the comparison is not skewed by different
# hardware. Fails when a benchmark regresses by more than THRESHOLD percent twice:
# the first time, both are measured again, since a busy runner can slow a
# microsecond benchmark by half.

on:
  pull_request:
    # A pull request that only changes documentation skips the tests and scans (main
    # still runs everything after the merge).
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  THRESHOLD: "25"
  QT_QPA_PLATFORM: offscreen

jobs:
  benchmark:
    name: Compare with base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: head
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: head/pyproject.toml
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2 libegl1 libgl1
      - name: Install dependencies
        run: python -m pip install -e "./head[dev]"

      - name: Benchmark base
        id: base
        working-directory: base
        run: |
          if [ -d benchmarks ] && [ -d src/ytktv ]; then
            PYTHONPATH="$PWD/src:$PWD" python -m pytest benchmarks --benchmark-only \
              --benchmark-json="$RUNNER_TEMP/base.json" -q -p no:cacheprovider
          else
            echo "The base branch has no benchmarks yet; skipping the baseline."
          fi

      - name: Benchmark head
        working-directory: head
        run: |
          PYTHONPATH="$PWD/src:$PWD" python -m pytest benchmarks --benchmark-only \
            --benchmark-json="$RUNNER_TEMP/head.json" -q -p no:cacheprovider

      - name: Compare
        id: compare
        working-directory: head
        run: |
          set +e
          python benchmarks/compare.py --base "$RUNNER_TEMP/base.json" --head "$RUNNER_TEMP/head.json" \
            --threshold "$THRESHOLD" --output "$RUNNER_TEMP/report.md"
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Measure again after a regression
        id: again
        if: steps.compare.outputs.status != '0'
        run: |
          set +e
          (cd base && [ -d benchmarks ] && PYTHONPATH="$PWD/src:$PWD" python -m pytest benchmarks \
            --benchmark-only --benchmark-json="$RUNNER_TEMP/base.json" -q -p no:cacheprovider)
          (cd head && PYTHONPATH="$PWD/src:$PWD" python -m pytest benchmarks \
            --benchmark-only --benchmark-json="$RUNNER_TEMP/head.json" -q -p no:cacheprovider)
          cd head
          python benchmarks/compare.py --base "$RUNNER_TEMP/base.json" --head "$RUNNER_TEMP/head.json" \
            --threshold "$THRESHOLD" --output "$RUNNER_TEMP/report.md"
          echo "status=$?" >> "$GITHUB_OUTPUT"
          { echo; echo "## Measured again"; cat "$RUNNER_TEMP/report.md"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report for the comment
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-report
          path: ${{ runner.temp }}/report.md
          if-no-files-found: ignore

      - name: Fail on regression
        if: steps.compare.outputs.status != '0' && steps.again.outputs.status != '0'
        run: |
          echo "::error::A benchmark regressed by more than ${THRESHOLD}%, twice. See the job summary."
          exit 1

  comment:
    # A job of its own, without the pull request's code: the token that writes the comment is
    # never in a job that ran that code. (Pull requests from forks get no secrets at all, so
    # there the read-only built-in token is used and the comment is skipped.)
    name: Benchmark comment
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: benchmark-report
          path: ${{ runner.temp }}
      - name: Comment on the pull request
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.AGENT_TOKEN || github.token }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/report.md`, 'utf8');
            const marker = '<!-- ytktv-benchmark-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find((c) => c.body && c.body.includes(marker));
            // Edited in place only when it is ours; one by another identity is replaced.
            let me = 'github-actions[bot]';
            try { me = (await github.rest.users.getAuthenticated()).data.login; } catch (e) {}
            if (previous && previous.user && previous.user.login === me) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              if (previous) await github.rest.issues.deleteComment({ owner, repo, comment_id: previous.id });
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

