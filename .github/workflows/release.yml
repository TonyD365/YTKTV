name: Release

# Builds the installers for every platform and attaches them to a GitHub
# Release that you create by hand:
#
#   1. On GitHub: Releases -> Draft a new release, choose a new tag such as
#      v1.0.0 on main, tick "Set as the latest release", and publish.
#   2. This workflow starts, builds the macOS .pkg (one universal installer for
#      Apple Silicon and Intel), the Windows installer and the Linux AppImage
#      from that tag, and uploads them plus SHA256SUMS to the release.
#
# mpv is neither inside the installers nor attached to the release: it is under
# the GPL, which YTKTV's license is not compatible with. When the app finds no mpv
# it offers to install it the usual way for each system (Homebrew, the Windows
# build linked from mpv.io, the Linux package manager). The builds install mpv
# that way too, only to check that the packaged app can play through it.
#
# Installed copies of YTKTV poll /releases/latest and update once the
# installers are attached. A release marked as a pre-release is never offered
# as an update.
#
# Run the workflow manually (Actions -> Release -> Run workflow) to test the
# builds without touching any release; the installers are kept as artifacts.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # separation: how each build gets the vocal-separation libraries.
          #   bundle    inside the app (Apple Silicon: torch has Metal built in)
          #   download  the app detects the GPU on first run and downloads a CUDA, DirectML
          #             or CPU runtime, so the installer stays small
          #   none      the libraries do not support the platform
          - { name: macos-arm64, os: macos-14, separation: bundle }
          - { name: macos-x86_64, os: macos-15-intel, separation: none }
          - { name: windows-x64, os: windows-latest, separation: download }
          - { name: linux-x86_64, os: ubuntu-24.04, separation: download }
    env:
      YTKTV_SEPARATION_MODE: ${{ matrix.separation }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version comes from the git tag
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install YTKTV
        shell: bash
        run: |
          python -m pip install --upgrade pip
          extras="package"
          if [ "$YTKTV_SEPARATION_MODE" = "bundle" ]; then extras="package,separation"; fi
          python -m pip install ".[${extras}]"
          python -c "import ytktv; print('Building YTKTV', ytktv.__version__)"

      - name: Check the version matches the release tag
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python -c 'import ytktv; print(ytktv.__version__)')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Package version ${version} does not match release tag ${TAG}. Tags must look like v1.2.3."
            exit 1
          fi

      # Signing is optional. Add these repository secrets to ship a signed, notarized pkg:
      #   MACOS_CERTIFICATE_P12       base64 of a .p12 holding the Developer ID Application
      #                               and Developer ID Installer certificates
      #   MACOS_CERTIFICATE_PASSWORD  password of that .p12
      #   MACOS_CODESIGN_IDENTITY     e.g. "Developer ID Application: Jane Doe (TEAMID)"
      #   MACOS_INSTALLER_IDENTITY    e.g. "Developer ID Installer: Jane Doe (TEAMID)"
      #   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarization
      # Without them the build is ad-hoc signed and users must allow it manually.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if ! packaging/macos/import_certificate.sh; then
            echo "::notice::No signing certificate configured; building an ad-hoc signed package."
            unset CODESIGN_IDENTITY INSTALLER_IDENTITY APPLE_ID
          fi
          PYTHON=python packaging/macos/build_pkg.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # pwsh does not stop when a native command fails, so check each one.
          function Check { if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          python packaging/make_icon.py build/icon; Check
          python -m PyInstaller packaging/ytktv.spec --noconfirm --distpath dist --workpath build/pyinstaller; Check
          $version = python -c "import ytktv; print(ytktv.__version__)"; Check
          choco install innosetup --no-progress -y; Check
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\installer.iss; Check

      - name: Build (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2 libegl1 libgl1 \
            libxkbcommon0 libdbus-1-3 libfontconfig1 file
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool && sudo mv appimagetool /usr/local/bin/appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 PYTHON=python packaging/linux/build_appimage.sh

      # mpv must not be inside the app (it was not installed while building, so neither it
      # nor the FFmpeg libraries it uses could be picked up). Then install it the way a user
      # would and have the packaged app play through it with the real filter chain.
      - name: Check mpv is not inside the app
        shell: bash
        run: |
          found="$(find dist/YTKTV dist/YTKTV.app \( -iname 'libmpv*' -o -iname 'mpv-*.dll' -o -iname 'libavcodec*' -o -iname 'avcodec-*.dll' \) 2>/dev/null || true)"
          if [ -n "$found" ]; then
            echo "::error::mpv libraries were packaged into the app:"; echo "$found"; exit 1
          fi

      - name: Install mpv as a user would
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) brew install mpv ;;
            Linux) sudo apt-get install -y --no-install-recommends libmpv2 ;;
            Windows) python -c "from ytktv import bootstrap; bootstrap.install_windows_libmpv(print)" ;;
          esac

      - name: Play through mpv with the packaged app (macOS)
        if: runner.os == 'macOS'
        run: dist/YTKTV.app/Contents/MacOS/YTKTV --mpv-self-test

      - name: Play through mpv with the packaged app (Linux)
        if: runner.os == 'Linux'
        run: dist/YTKTV/YTKTV --mpv-self-test

      - name: Play through mpv with the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          YTKTV_LOG_FILE: ${{ runner.temp }}\mpv-self-test.log
        run: |
          $process = Start-Process -FilePath dist\YTKTV\YTKTV.exe -ArgumentList '--mpv-self-test' -Wait -PassThru
          Get-Content $env:YTKTV_LOG_FILE -ErrorAction SilentlyContinue
          exit $process.ExitCode

      # Phones as microphones need the TLS and web stack intact inside the packaged app.
      - name: Check the packaged app can serve the phone microphone page (macOS)
        if: runner.os == 'macOS'
        run: dist/YTKTV.app/Contents/MacOS/YTKTV --phone-mic-self-test

      - name: Check the packaged app can serve the phone microphone page (Linux)
        if: runner.os == 'Linux'
        run: dist/YTKTV/YTKTV --phone-mic-self-test

      - name: Check the packaged app can serve the phone microphone page (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          YTKTV_LOG_FILE: ${{ runner.temp }}\phone-mic.log
        run: |
          $process = Start-Process -FilePath dist\YTKTV\YTKTV.exe -ArgumentList '--phone-mic-self-test' -Wait -PassThru
          Get-Content $env:YTKTV_LOG_FILE -ErrorAction SilentlyContinue
          exit $process.ExitCode

      # The HD unlock needs yt-dlp to find a bundled plugin and the solver's JavaScript;
      # both are easy to lose when freezing, so ask the packaged app to check itself.
      - name: Check the packaged app can use HD unlock (macOS)
        if: runner.os == 'macOS'
        run: dist/YTKTV.app/Contents/MacOS/YTKTV --hd-unlock-self-test

      - name: Check the packaged app can use HD unlock (Linux)
        if: runner.os == 'Linux'
        run: dist/YTKTV/YTKTV --hd-unlock-self-test

      - name: Check the packaged app can use HD unlock (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          YTKTV_LOG_FILE: ${{ runner.temp }}\hd-unlock.log
        run: |
          $process = Start-Process -FilePath dist\YTKTV\YTKTV.exe -ArgumentList '--hd-unlock-self-test' -Wait -PassThru
          Get-Content $env:YTKTV_LOG_FILE -ErrorAction SilentlyContinue
          exit $process.ExitCode

      # Prove the packaged app can fetch a runtime and separate audio with it. CI machines
      # have no GPU, so this exercises the CPU runtime; the GPU ones use the same path.
      - name: Test the downloadable separation runtime (Linux)
        if: runner.os == 'Linux' && matrix.separation == 'download'
        env:
          YTKTV_SEPARATION_VARIANT: cpu
          YTKTV_SEPARATION_ROOT: ${{ runner.temp }}/separation-runtime
        run: dist/YTKTV/YTKTV --separation-self-test

      - name: Test the downloadable separation runtime (Windows)
        if: runner.os == 'Windows' && matrix.separation == 'download'
        shell: pwsh
        env:
          YTKTV_SEPARATION_VARIANT: cpu
          YTKTV_SEPARATION_ROOT: ${{ runner.temp }}\separation-runtime
          YTKTV_LOG_FILE: ${{ runner.temp }}\self-test.log
        run: |
          $process = Start-Process -FilePath dist\YTKTV\YTKTV.exe -ArgumentList '--separation-self-test' -Wait -PassThru
          Get-Content $env:YTKTV_LOG_FILE -ErrorAction SilentlyContinue
          exit $process.ExitCode

      - name: Check installer size
        shell: bash
        run: |
          for file in dist/*.pkg dist/*-setup.exe dist/*.AppImage; do
            [ -e "$file" ] || continue
            size=$(wc -c < "$file")
            echo "$file: $((size / 1048576)) MiB"
            if [ "$size" -ge 2147483648 ]; then
              echo "::error::$file is larger than 2 GiB and cannot be attached to a GitHub release."
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.name }}
          path: |
            dist/*.pkg
            dist/*-setup.exe
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

  # YTKTV Desk, the front desk for rooms: a small app with no player or separation.
  desk:
    name: Build Desk (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-14 }
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: windows-x64, os: windows-latest }
          - { name: linux-x86_64, os: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version comes from the git tag
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install YTKTV
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[package]"
      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: |
          if ! packaging/macos/import_certificate.sh; then unset CODESIGN_IDENTITY INSTALLER_IDENTITY; fi
          PYTHON=python packaging/desk/build.sh
          "dist/YTKTV Desk.app/Contents/MacOS/YTKTV Desk" --self-test
      - name: Build (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 \
            libdbus-1-3 libfontconfig1 file
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool && sudo mv appimagetool /usr/local/bin/appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 PYTHON=python packaging/desk/build.sh
          "dist/YTKTV Desk/YTKTV Desk" --self-test
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Check { if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          python packaging/make_icon.py build/desk-icon src/ytktv/desk/assets/icon.png; Check
          python -m PyInstaller packaging/desk.spec --noconfirm --distpath dist --workpath build/desk; Check
          $process = Start-Process -FilePath "dist\YTKTV Desk\YTKTV Desk.exe" -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          $version = python -c "import ytktv; print(ytktv.__version__)"; Check
          choco install innosetup --no-progress -y; Check
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\desk_installer.iss; Check
      - uses: actions/upload-artifact@v7
        with:
          # Not "installer-macos-*": the universal YTKTV package must not pick these up.
          name: installer-desk-${{ matrix.name }}
          path: |
            dist/YTKTV-Desk-*.pkg
            dist/YTKTV-Desk-*-setup.exe
            dist/YTKTV-Desk-*.AppImage
          if-no-files-found: error
          retention-days: 7

  macos-universal:
    name: Build (macos-universal)
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: parts
          pattern: installer-macos-*
          merge-multiple: true
      # One installer for every Mac: it carries both builds and installs the one
      # matching the machine. Only this package is attached to the release.
      - name: Combine into a universal installer
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if ! packaging/macos/import_certificate.sh; then unset INSTALLER_IDENTITY APPLE_ID; fi
          arm="$(ls parts/*-macos-arm64.pkg)"
          intel="$(ls parts/*-macos-x86_64.pkg)"
          version="$(basename "$arm" | sed -E 's/^YTKTV-(.*)-macos-arm64\.pkg$/\1/')"
          packaging/macos/build_universal_pkg.sh "$arm" "$intel" "$version" dist
      - uses: actions/upload-artifact@v7
        with:
          name: installer-macos-universal
          path: dist/*.pkg
          if-no-files-found: error
          retention-days: 7

  attach:
    name: Attach installers to the release
    needs: [build, macos-universal, desk]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          pattern: installer-*
          merge-multiple: true
      - name: Checksums
        working-directory: installers
        run: |
          # The universal installer replaces the two per-architecture macOS packages.
          # (YTKTV Desk ships one package per architecture.)
          rm -f ./YTKTV-[0-9]*-macos-arm64.pkg ./YTKTV-[0-9]*-macos-x86_64.pkg
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" installers/* --clobber
