name: Release

# Push a tag like v1.0.0 to build installers for every platform and publish a
# GitHub Release marked "Latest". Installed copies of YTKTV poll
# /releases/latest, so publishing here is what rolls the update out.
#
# Tags with a suffix (v1.1.0-rc1) are published as pre-releases and are never
# offered as updates. Run the workflow manually to test the builds without
# publishing anything.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      bundle_separation:
        description: Bundle the vocal-separation runtime (large)
        type: boolean
        default: true

permissions:
  contents: read

env:
  YTKTV_BUNDLE_SEPARATION: ${{ github.event_name == 'workflow_dispatch' && !inputs.bundle_separation && '0' || '1' }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-14 }
          - { name: windows-x64, os: windows-latest }
          - { name: linux-x86_64, os: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version comes from the git tag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install YTKTV
        shell: bash
        run: |
          python -m pip install --upgrade pip
          extras="package"
          if [ "$YTKTV_BUNDLE_SEPARATION" = "1" ]; then extras="package,separation"; fi
          python -m pip install ".[${extras}]"
          python -c "import ytktv; print('Building YTKTV', ytktv.__version__)"

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(python -c 'import ytktv; print(ytktv.__version__)')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Package version ${version} does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi

      # Signing is optional. Add these repository secrets to ship a signed, notarized pkg:
      #   MACOS_CERTIFICATE_P12       base64 of a .p12 holding the Developer ID Application
      #                               and Developer ID Installer certificates
      #   MACOS_CERTIFICATE_PASSWORD  password of that .p12
      #   MACOS_CODESIGN_IDENTITY     e.g. "Developer ID Application: Jane Doe (TEAMID)"
      #   MACOS_INSTALLER_IDENTITY    e.g. "Developer ID Installer: Jane Doe (TEAMID)"
      #   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarization
      # Without them the build is ad-hoc signed and users must allow it manually.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          brew install mpv
          if [ -n "$MACOS_CERTIFICATE_P12" ]; then
            keychain="$RUNNER_TEMP/signing.keychain-db"
            keychain_password="$(uuidgen)"
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
            security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/pkgbuild -T /usr/bin/productsign
            security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
            security list-keychains -d user -s "$keychain"
            rm "$RUNNER_TEMP/certificate.p12"
          else
            echo "::notice::No signing certificate configured; building an ad-hoc signed package."
            unset CODESIGN_IDENTITY INSTALLER_IDENTITY APPLE_ID
          fi
          PYTHON=python packaging/macos/build_pkg.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "from ytktv import bootstrap; bootstrap.install_windows_libmpv(print)"
          python packaging/make_icon.py build/icon
          python -m PyInstaller packaging/ytktv.spec --noconfirm --distpath dist --workpath build/pyinstaller
          $version = python -c "import ytktv; print(ytktv.__version__)"
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\installer.iss

      - name: Build (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmpv2 libportaudio2 libegl1 libgl1 \
            libxkbcommon0 libdbus-1-3 libfontconfig1 file
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool && sudo mv appimagetool /usr/local/bin/appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 PYTHON=python packaging/linux/build_appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            dist/*.pkg
            dist/*-setup.exe
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installer-*
          merge-multiple: true
      - name: Checksums
        working-directory: installers
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=(--title "YTKTV ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag)
          case "$GITHUB_REF_NAME" in
            *-*) flags+=(--prerelease --latest=false) ;;
            *) flags+=(--latest) ;;
          esac
          gh release create "$GITHUB_REF_NAME" installers/* "${flags[@]}"
