name: Website

# Publishes site/ to GitHub Pages (https://tonyd365.github.io/YTKTV/), with the
# screenshots from docs/images and the app icon. Pages must be set to deploy from
# GitHub Actions in the repository settings.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/images/**"
      - "src/ytktv/ui/assets/icon.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish the website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Assemble the site
        run: |
          mkdir -p _site/images
          cp site/* _site/
          cp docs/images/*.png docs/images/*.mp4 _site/images/
          cp src/ytktv/ui/assets/icon.png _site/images/icon.png
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
