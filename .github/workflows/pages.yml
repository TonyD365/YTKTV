name: Website

# Publishes site/ to GitHub Pages (https://tonyd365.github.io/YTKTV/), with the
# screenshots from docs/images and the app icon. Pages must be set to deploy from
# GitHub Actions in the repository settings.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/images/**"
      - "src/ytktv/ui/assets/icon.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish the website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/images
          cp site/* _site/
          cp docs/images/*.png _site/images/
          cp src/ytktv/ui/assets/icon.png _site/images/icon.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
