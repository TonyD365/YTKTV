# Area labels for pull requests, by the files they touch (see workflows/labeler.yml).
# desk, separation, packaging and installer also start heavier tests for those files
# (area-tests.yml, installer-tests.yml): keep their file lists in step.
player:
  - changed-files:
      - any-glob-to-any-file:
          ["src/ytktv/player/**", "src/ytktv/ui/mv_window.py", "src/ytktv/ui/mv_overlays.py", "src/ytktv/bootstrap.py", "src/ytktv/core/preload.py"]
mixer:
  - changed-files:
      - any-glob-to-any-file:
          ["src/ytktv/audio/**", "src/ytktv/ui/mixer_panel.py", "src/ytktv/ui/console_widgets.py"]
separation:
  - changed-files:
      - any-glob-to-any-file: ["src/ytktv/separation/**", "src/ytktv/ui/separation_setup.py", "tests/live/test_separation_live.py"]
phone:
  - changed-files:
      - any-glob-to-any-file: ["src/ytktv/server/**", "src/ytktv/audio/phone_mic.py"]
lyrics:
  - changed-files:
      - any-glob-to-any-file: ["src/ytktv/youtube/lyrics.py", "src/ytktv/lyrics_ai/**"]
scoring:
  - changed-files:
      - any-glob-to-any-file: ["src/ytktv/core/scoring.py", "src/ytktv/separation/pitch_core.py"]
updater:
  - changed-files:
      - any-glob-to-any-file: ["src/ytktv/updater.py", "src/ytktv/ui/update_manager.py", "src/ytktv/mpv_pack.py"]
packaging:
  - changed-files:
      - any-glob-to-any-file: ["packaging/**", ".github/workflows/release.yml"]
ci:
  - changed-files:
      - any-glob-to-any-file: [".github/**"]
documentation:
  - changed-files:
      - any-glob-to-any-file: ["*.md", "docs/**", "site/**"]
dependencies:
  - changed-files:
      - any-glob-to-any-file: ["pyproject.toml"]
desk:
  - changed-files:
      - any-glob-to-any-file: ["src/ytktv/desk/**", "src/ytktv/rooms/**", "packaging/desk.spec", "tests/live/test_desk_live.py"]
tests:
  - changed-files:
      - any-glob-to-any-file: ["tests/**"]
# Keep in step with the files installer-tests.yml looks at.
installer:
  - changed-files:
      - any-glob-to-any-file:
          ["installer/**", "site/install.sh", "site/install.ps1", "packaging/installer/**", "packaging/windows/*.iss", "packaging/macos/build_universal_pkg.sh", "packaging/macos/scripts/**", ".github/workflows/installer-tests.yml"]
