[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ytktv"
dynamic = ["version"]
description = "Turn any computer into a karaoke (KTV) machine powered by YouTube."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LicenseRef-YTKTV-1.0" }
authors = [{ name = "TonyD365" }]
dependencies = [
    "PySide6-Essentials>=6.12.0",
    "mpv>=1.0.8",
    "yt-dlp>=2026.10.26",
    # Used by the optional HD unlock for restricted videos (see youtube/hd_unlock.py).
    "yt-dlp-ejs",
    "bgutil-ytdlp-pot-provider>=2.0.2",
    "sounddevice>=0.5.6",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "qrcode>=8.2",
    "platformdirs>=4.14.3",
    "imageio-ffmpeg>=0.8.0",
    "packaging>=26.3",
    "certifi",
    # No wheels for Intel Macs or Windows on ARM: release.yml builds it there (Rust, and
    # OpenSSL linked in statically so it cannot clash with Python's own).
    "cryptography>=50.0.2",
    # Finds the front desk on the local network even when its IP address changes.
    "zeroconf>=0.153.0",
    # Pinyin initials for the song book: "yldb" finds 月亮代表我的心.
    "pypinyin>=0.55.0",
]

[project.optional-dependencies]
# Cast to Chromecast (ytktv/cast.py); pychromecast is MIT-licensed.
cast = ["pychromecast>=14.1.1"]
separation = ["audio-separator[cpu]>=0.48.0", "audioread"]
separation-cuda = ["audio-separator[gpu]>=0.48.0", "audioread"]
dev = [
    # pytest 9.2 removed something pytest-benchmark 5.3 still uses; lift once it catches up.
    "pytest>=9.1.1,<9.2",
    "pytest-qt>=4.5.0",
    "pytest-benchmark>=5.3.1",
    "httpx>=0.28.1",
    "ruff>=0.17.3",
    "mypy>=2.4.1",
]
package = ["pyinstaller>=6.22.3", "uv>=0.13.7"]

[project.scripts]
ytktv = "ytktv.__main__:main"
ytktv-desk = "ytktv.desk.__main__:main"

[project.urls]
Homepage = "https://github.com/TonyD365/YTKTV"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/ytktv/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ytktv"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/ytktv/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Qt style sheets read best one rule per line.
"src/ytktv/ui/theme.py" = ["E501"]
"src/ytktv/ui/mixer_panel.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["_version\\.py$"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
qt_api = "pyside6"
